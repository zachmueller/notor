name: Release Obsidian plugin

on:
  push:
    tags:
      - "*"

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v3

      - name: Use Node.js
        uses: actions/setup-node@v3
        with:
          node-version: "20.x"

      - name: Install dependencies
        run: npm install

      # Obsidian's automated review lints every release with eslint-plugin-obsidianmd
      # and delists versions that fail; never publish one that fails here first.
      - name: Lint
        run: npm run lint

      # Re-lints with the scanner's latest rules and scope, and checks the release
      # metadata against the tag (.claude/skills/community-review-guard).
      - name: Community review guard
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm run review:guard -- --ci --tag "${GITHUB_REF#refs/tags/}"

      - name: Build plugin
        run: npm run build

      - name: Create release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="${GITHUB_REF#refs/tags/}"

          gh release create "$tag" \
            --title="$tag" \
            --draft \
            build/main.js build/manifest.json build/styles.css
